<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Entrada de Produtos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1, h2 {
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    input, button, select {
      padding: 8px 10px;
      border: 1px solid #000;
      font-size: 14px;
      margin: 5px;
    }

    button {
      cursor: pointer;
    }

    ul#listaProdutos {
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }

    ul#listaProdutos li {
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remove-btn {
      padding: 4px 8px;
      font-size: 12px;
    }

    .total-info {
      padding: 10px;
      border: 1px solid #000;
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #000;
      padding: 12px;
      text-align: left;
    }

    .action-buttons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .action-buttons button {
      padding: 4px 8px;
      font-size: 12px;
      margin: 0;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row input {
      flex: 1;
      min-width: 150px;
    }
  </style>
</head>
<body>

<h1>Registro de Entrada de Produtos</h1>

  <h2>Dados da Entrada</h2>
  
  <div class="form-group">
    <label for="fornecedor">Fornecedor:</label>
    <input type="text" id="fornecedor" placeholder="Nome do fornecedor" style="flex: 1; min-width: 200px;">
    
    <label for="dataEntrada">Data da Entrada:</label>
    <input type="date" id="dataEntrada" style="min-width: 150px;">
  </div>

  <h2>Adicionar Produtos</h2>
  
  <div class="form-row">
    <input type="text" id="produto" placeholder="Nome do Produto" style="flex: 2;">
    <input type="number" id="quantidade" placeholder="Quantidade" min="1" style="flex: 1;">
    <input type="number" id="precoUnitario" placeholder="Preço Unitário" min="0.01" step="0.01" style="flex: 1;">
    <button onclick="adicionarProduto()" style="margin: 0;">+ Adicionar</button>
  </div>

  <h2>Produtos da Entrada</h2>
  
  <ul id="listaProdutos"></ul>

  <div id="totalInfo" class="total-info" style="display: none;"></div>

  <div class="form-group">
    <button onclick="salvarEntrada()">Salvar Entrada</button>
    <button onclick="limparFormulario()">Limpar</button>
  </div>

  <h2>Entradas Registradas</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Fornecedor</th>
        <th>Data da Entrada</th>
        <th>Quantidade Total</th>
        <th>Valor Total</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaEntradas"></tbody>
  </table>

<script src="mock_entradas_bar.js"></script>
<script>
let entradas = [];
let produtosTemp = [];
let editandoId = null;

if (typeof mockEntradasBar !== 'undefined' && Array.isArray(mockEntradasBar)) {
  entradas = [...mockEntradasBar];
  renderTabela();
}

function adicionarProduto() {
  const nome = document.getElementById("produto").value.trim();
  const qtd = parseInt(document.getElementById("quantidade").value);
  const preco = parseFloat(document.getElementById("precoUnitario").value);

  if (!nome || !qtd || !preco || qtd <= 0 || preco <= 0) {
    return alert("Preencha todos os campos do produto com valores válidos");
  }

  const total = qtd * preco;

  produtosTemp.push({ nome, qtd, preco, total });

  renderProdutosTemp();
  atualizarTotal();

  document.getElementById("produto").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("precoUnitario").value = "";
  document.getElementById("produto").focus();
}

function renderProdutosTemp() {
  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";

  produtosTemp.forEach((p, index) => {
    lista.innerHTML += `
      <li>
        <div>
          <strong>${p.nome}</strong> - ${p.qtd} un. × R$ ${p.preco.toFixed(2)} = <strong>R$ ${p.total.toFixed(2)}</strong>
        </div>
        <button class="remove-btn" onclick="removerProduto(${index})">Remover</button>
      </li>
    `;
  });
}

function removerProduto(index) {
  produtosTemp.splice(index, 1);
  renderProdutosTemp();
  atualizarTotal();
}

function atualizarTotal() {
  const totalInfo = document.getElementById("totalInfo");
  
  if (produtosTemp.length === 0) {
    totalInfo.style.display = "none";
    return;
  }

  let totalQtd = 0;
  let totalValor = 0;
  
  produtosTemp.forEach(p => {
    totalQtd += p.qtd;
    totalValor += p.total;
  });

  totalInfo.style.display = "block";
  totalInfo.innerText = `Quantidade Total: ${totalQtd} un. | Valor Total: R$ ${totalValor.toFixed(2)}`;
}

function salvarEntrada() {
  const fornecedor = document.getElementById("fornecedor").value.trim();
  const dataEntrada = document.getElementById("dataEntrada").value;

  if (!fornecedor || !dataEntrada || produtosTemp.length === 0) {
    return alert("Preencha fornecedor, data da entrada e adicione produtos");
  }

  let totalQtd = 0;
  let totalValor = 0;
  produtosTemp.forEach(p => {
    totalQtd += p.qtd;
    totalValor += p.total;
  });

  if (editandoId !== null) {
    const entrada = entradas.find(e => e.id === editandoId);
    entrada.fornecedor = fornecedor;
    entrada.dataEntrada = dataEntrada;
    entrada.produtos = [...produtosTemp];
    entrada.totalQtd = totalQtd;
    entrada.totalValor = totalValor;
    editandoId = null;
  } else {
    entradas.push({
      id: Date.now(),
      fornecedor,
      dataEntrada,
      produtos: [...produtosTemp],
      totalQtd,
      totalValor
    });
  }

  limparFormulario();
  renderTabela();
}

function renderTabela() {
  const tabela = document.getElementById("tabelaEntradas");
  tabela.innerHTML = "";

  entradas.forEach(e => {
    tabela.innerHTML += `
      <tr>
        <td>${e.id}</td>
        <td>${e.fornecedor}</td>
        <td>${new Date(e.dataEntrada).toLocaleDateString('pt-BR')}</td>
        <td>${e.totalQtd} un.</td>
        <td>R$ ${e.totalValor.toFixed(2)}</td>
        <td>
          <div class="action-buttons">
            <button onclick="verDetalhes(${e.id})">Detalhes</button>
            <button onclick="editarEntrada(${e.id})">Editar</button>
            <button onclick="deletarEntrada(${e.id})">Excluir</button>
          </div>
        </td>
      </tr>
    `;
  });
}

function verDetalhes(id) {
  const entrada = entradas.find(e => e.id === id);

  let texto = `Fornecedor: ${entrada.fornecedor}\n`;
  texto += `Data da Entrada: ${new Date(entrada.dataEntrada).toLocaleDateString('pt-BR')}\n`;
  texto += `Quantidade Total: ${entrada.totalQtd} un.\n`;
  texto += `Valor Total: R$ ${entrada.totalValor.toFixed(2)}\n\nProdutos:\n`;

  entrada.produtos.forEach(p => {
    texto += `- ${p.nome}: ${p.qtd} un. × R$ ${p.preco.toFixed(2)} = R$ ${p.total.toFixed(2)}\n`;
  });

  alert(texto);
}

function editarEntrada(id) {
  const entrada = entradas.find(e => e.id === id);

  document.getElementById("fornecedor").value = entrada.fornecedor;
  document.getElementById("dataEntrada").value = entrada.dataEntrada;
  produtosTemp = JSON.parse(JSON.stringify(entrada.produtos));
  editandoId = id;

  renderProdutosTemp();
  atualizarTotal();
  
  window.scrollTo(0, 0);
  document.getElementById("produto").focus();
}

function deletarEntrada(id) {
  if (confirm("Tem certeza que deseja excluir esta entrada?")) {
    entradas = entradas.filter(e => e.id !== id);
    renderTabela();
  }
}

function limparFormulario() {
  document.getElementById("fornecedor").value = "";
  document.getElementById("dataEntrada").value = "";
  document.getElementById("produto").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("precoUnitario").value = "";
  produtosTemp = [];
  editandoId = null;
  renderProdutosTemp();
  atualizarTotal();
}

// Inicializar data de hoje
document.getElementById("dataEntrada").valueAsDate = new Date();
</script>

</body>
</html>
