<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Entradas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { margin-bottom: 10px; }
    .summary { margin: 15px 0; padding: 10px; border: 1px solid #000; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #000; padding: 8px; text-align: left; }
    .actions { margin-top: 12px; }
    button { padding: 8px 12px; cursor: pointer; }
    .details { margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>

<h1>Relatório de Entradas</h1>

<div class="summary" id="summary">Carregando relatório...</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Fornecedor</th>
      <th>Data</th>
      <th>Quantidade Total</th>
      <th>Valor Total (R$)</th>
      <th>Detalhes</th>
    </tr>
  </thead>
  <tbody id="relatorioTabela"></tbody>
</table>

<div class="actions">
  <button onclick="window.history.back()">Voltar</button>
  <button onclick="imprimirRelatorio()">Imprimir</button>
</div>

<script src="mock_entradas_bar.js"></script>
<script>
  function formatCurrency(v) { return v.toFixed(2).replace('.', ','); }

  const entradas = (typeof mockEntradasBar !== 'undefined' && Array.isArray(mockEntradasBar)) ? mockEntradasBar : [];

  function renderRelatorio() {
    const tabela = document.getElementById('relatorioTabela');
    const summary = document.getElementById('summary');
    tabela.innerHTML = '';

    if (entradas.length === 0) {
      summary.innerText = 'Nenhuma entrada registrada.';
      return;
    }

    let somaQtd = 0;
    let somaValor = 0;

    entradas.forEach(e => {
      somaQtd += e.totalQtd || 0;
      somaValor += e.totalValor || 0;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${e.id}</td>
        <td>${e.fornecedor}</td>
        <td>${new Date(e.dataEntrada).toLocaleDateString('pt-BR')}</td>
        <td>${e.totalQtd} un.</td>
        <td>${formatCurrency(e.totalValor)}</td>
        <td><button onclick='mostrarDetalhes(${e.id})'>Ver</button></td>
      `;
      tabela.appendChild(tr);
    });

    summary.innerHTML = `Entradas: <strong>${entradas.length}</strong> | Quantidade total: <strong>${somaQtd} un.</strong> | Valor total: <strong>R$ ${formatCurrency(somaValor)}</strong>`;
  }

  function mostrarDetalhes(id) {
    const e = entradas.find(x => x.id === id);
    if (!e) return alert('Entrada não encontrada.');

    let texto = `Fornecedor: ${e.fornecedor}\nData: ${new Date(e.dataEntrada).toLocaleDateString('pt-BR')}\nQuantidade: ${e.totalQtd} un.\nValor: R$ ${formatCurrency(e.totalValor)}\n\nProdutos:\n`;
    e.produtos.forEach(p => {
      texto += `- ${p.nome}: ${p.qtd} un. × R$ ${formatCurrency(p.preco)} = R$ ${formatCurrency(p.total)}\n`;
    });

    alert(texto);
  }

  function imprimirRelatorio() {
    window.print();
  }

  renderRelatorio();
</script>

</body>
</html>
