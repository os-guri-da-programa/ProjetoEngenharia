<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cardápio</title>

  <link rel="stylesheet" href="../pasta_fabiane/index.css">

  <style>
    .cardapio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .produto-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    .produto-card h3 {
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .tipo {
      color: #3498db;
      font-weight: bold;
    }

    .preco {
      font-size: 20px;
      margin-top: 10px;
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="dashboard-container">

  <aside class="sidebar">

    <div class="logo">
      <h1>Cliente</h1>
    </div>

    <nav class="menu">

      <section class="menu-group">
        <h3>Área do Cliente</h3>

        <ul>
          <li><a href="../pasta_enzo/cardapio.html">Cardápio</a></li>
          <li><a href="../pasta_davi/avaliacao.html">Avaliar Estabelecimento</a></li>
          <li><a href="../pasta_mateus/cronograma_shows.html">Cronogramas de Shows</a></li>
          <li><a href="../pasta_pedro/reservas.html">Reservas e Atendimento</a></li>
          <li><a href="../pasta_fabiane/index.html">Sair</a></li>
        </ul>

      </section>

    </nav>

  </aside>

  <main class="content">

    <header class="content-header">
      <h2>Cardápio</h2>
      <div class="user-info">Cliente</div>
    </header>

    <section class="view-container">

      <div id="cardapio" class="cardapio-grid"></div>

    </section>

  </main>

</div>

<script>

let produtos =
  JSON.parse(localStorage.getItem("produtos")) || [];

const cardapio =
  document.getElementById("cardapio");

if(produtos.length === 0){

  cardapio.innerHTML = `
    <p>Nenhum produto cadastrado.</p>
  `;

}else{

  produtos.forEach(produto => {

    cardapio.innerHTML += `

      <div class="produto-card">

        <h3>${produto.nome}</h3>

        <div class="tipo">
          ${produto.tipoCusto}
        </div>

        <p>
          Disponível:
          ${produto.quantidade}
        </p>

        <div class="preco">
          R$ ${Number(produto.venda).toFixed(2)}
        </div>

      </div>

    `;

  });

}

</script>

</body>
</html>
