<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Vendas</title>

<style>
body { font-family: Arial; margin: 20px; }
input, button { margin: 5px; padding: 6px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
h2 { margin-top: 30px; }
</style>

</head>
<body>

<h2>Cadastro de Cliente</h2>
<input type="text" id="nomeCliente" placeholder="Nome completo">
<input type="text" id="cpfCliente" placeholder="CPF">
<input type="text" id="telCliente" placeholder="Telefone">
<button onclick="addCliente()">Cadastrar Cliente</button>

<ul id="listaClientes"></ul>

<hr>

<h2>Cadastro de Produto</h2>
<input type="text" id="nomeProduto" placeholder="Nome">
<input type="date" id="validade">
<input type="number" id="precoProduto" placeholder="Preço">
<input type="number" id="qtdProduto" placeholder="Quantidade">
<input type="text" id="tipoCusto" placeholder="Tipo de custo">
<button onclick="addProduto()">Cadastrar Produto</button>

<ul id="listaProdutos"></ul>

<hr>

<h2>Registro de Venda (Comanda)</h2>

<select id="clienteVenda"></select>

<select id="produtoVenda"></select>
<input type="number" id="qtdVenda" placeholder="Quantidade">
<button onclick="addItemVenda()">Adicionar Item</button>

<ul id="itensVenda"></ul>
<h3 id="totalVenda">Total: R$ 0</h3>

<button onclick="finalizarVenda()">Finalizar Venda</button>

<hr>

<h2>Vendas</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>Cliente</th>
<th>Total</th>
</tr>
</thead>
<tbody id="tabelaVendas"></tbody>
</table>

<script>

let clientes = [];
let produtos = [];
let vendas = [];
let itensTemp = [];

function addCliente() {
  const nome = nomeCliente.value;
  const cpf = cpfCliente.value;
  const tel = telCliente.value;

  if (!nome || !cpf || !tel) return alert("Preencha tudo");

  clientes.push({ id: Date.now(), nome, cpf, tel });
  renderClientes();
}

function renderClientes() {
  listaClientes.innerHTML = "";
  clienteVenda.innerHTML = "";

  clientes.forEach(c => {
    listaClientes.innerHTML += `<li>${c.nome} - ${c.cpf}</li>`;
    clienteVenda.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
  });
}

function addProduto() {
  const nome = nomeProduto.value;
  const validade = validade.value;
  const preco = parseFloat(precoProduto.value);
  const qtd = parseInt(qtdProduto.value);
  const tipo = tipoCusto.value;

  if (!nome || !validade || !preco || !qtd || !tipo)
    return alert("Preencha tudo");

  produtos.push({
    id: Date.now(),
    nome,
    validade,
    preco,
    qtd,
    tipo
  });

  renderProdutos();
}

function renderProdutos() {
  listaProdutos.innerHTML = "";
  produtoVenda.innerHTML = "";

  produtos.forEach(p => {
    listaProdutos.innerHTML += `<li>${p.nome} - Qtd: ${p.qtd}</li>`;
    produtoVenda.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
  });
}

function addItemVenda() {
  const idProd = parseInt(produtoVenda.value);
  const qtd = parseInt(qtdVenda.value);

  const produto = produtos.find(p => p.id === idProd);

  if (!produto || qtd <= 0) return alert("Erro");

  if (produto.qtd < qtd) return alert("Estoque insuficiente");

  produto.qtd -= qtd;

  itensTemp.push({
    nome: produto.nome,
    qtd,
    preco: produto.preco,
    total: qtd * produto.preco
  });

  renderItens();
  renderProdutos();
}

function renderItens() {
  itensVenda.innerHTML = "";
  let total = 0;

  itensTemp.forEach(i => {
    itensVenda.innerHTML += `<li>${i.nome} - ${i.qtd}</li>`;
    total += i.total;
  });

  totalVenda.innerText = "Total: R$ " + total.toFixed(2);
}

function finalizarVenda() {
  const idCliente = parseInt(clienteVenda.value);
  const cliente = clientes.find(c => c.id === idCliente);

  if (!cliente || itensTemp.length === 0)
    return alert("Erro");

  let total = 0;
  itensTemp.forEach(i => total += i.total);

  vendas.push({
    id: Date.now(),
    cliente: cliente.nome,
    itens: [...itensTemp],
    total
  });

  itensTemp = [];
  renderItens();
  renderVendas();
}

function renderVendas() {
  tabelaVendas.innerHTML = "";

  vendas.forEach(v => {
    tabelaVendas.innerHTML += `
      <tr>
        <td>${v.id}</td>
        <td>${v.cliente}</td>
        <td>R$ ${v.total.toFixed(2)}</td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
