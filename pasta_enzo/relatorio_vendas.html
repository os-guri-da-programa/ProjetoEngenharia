<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Vendas</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }

    input, button {
      margin: 5px;
      padding: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    h2 {
      margin-top: 30px;
    }
  </style>
</head>
<body>

<h2>Relatório de Vendas</h2>

Filtro por data:<br>
<input type="date" id="dataInicio">
até
<input type="date" id="dataFim">
<button onclick="filtrar()">Filtrar</button>
<button onclick="limparFiltro()">Limpar</button>

<h3 id="totalGeral">Total Geral: R$ 0.00</h3>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Cliente</th>
      <th>Data</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody id="tabelaRelatorio"></tbody>
</table>

<h2>Resumo por Produto</h2>

<table>
  <thead>
    <tr>
      <th>Produto</th>
      <th>Quantidade Vendida</th>
    </tr>
  </thead>
  <tbody id="resumoProdutos"></tbody>
</table>

<script>
let vendas = [
  {
    id: 1,
    cliente: "João",
    data: "2026-03-30",
    total: 50,
    produtos: [
      { nome: "Hambúrguer", qtd: 2 },
      { nome: "Refri", qtd: 1 }
    ]
  },
  {
    id: 2,
    cliente: "Maria",
    data: "2026-03-31",
    total: 30,
    produtos: [
      { nome: "Pizza", qtd: 1 },
      { nome: "Refri", qtd: 2 }
    ]
  }
];

function render(vendasFiltradas) {
  const tabela = document.getElementById("tabelaRelatorio");
  const resumo = document.getElementById("resumoProdutos");

  tabela.innerHTML = "";
  resumo.innerHTML = "";

  let totalGeral = 0;
  let mapaProdutos = {};

  vendasFiltradas.forEach(v => {
    totalGeral += v.total;

    tabela.innerHTML += `
      <tr>
        <td>${v.id}</td>
        <td>${v.cliente}</td>
        <td>${v.data}</td>
        <td>R$ ${v.total.toFixed(2)}</td>
      </tr>
    `;

    v.produtos.forEach(p => {
      if (!mapaProdutos[p.nome]) {
        mapaProdutos[p.nome] = 0;
      }
      mapaProdutos[p.nome] += p.qtd;
    });
  });

  document.getElementById("totalGeral").innerText =
    "Total Geral: R$ " + totalGeral.toFixed(2);

  for (let produto in mapaProdutos) {
    resumo.innerHTML += `
      <tr>
        <td>${produto}</td>
        <td>${mapaProdutos[produto]}</td>
      </tr>
    `;
  }
}

function filtrar() {
  const inicio = document.getElementById("dataInicio").value;
  const fim = document.getElementById("dataFim").value;

  let filtradas = vendas;

  if (inicio && fim) {
    filtradas = vendas.filter(v => v.data >= inicio && v.data <= fim);
  }

  render(filtradas);
}

function limparFiltro() {
  document.getElementById("dataInicio").value = "";
  document.getElementById("dataFim").value = "";
  render(vendas);
}

render(vendas);
</script>

</body>
</html>
