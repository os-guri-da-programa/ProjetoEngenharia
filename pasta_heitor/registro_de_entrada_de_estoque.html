<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Estoque</title>
</head>
<body>

<h2>Cadastro de Clientes</h2>
<form id="clienteForm">
    <input type="text" id="nome" placeholder="Nome completo" required>
    <input type="text" id="cpf" placeholder="CPF" required>
    <input type="text" id="telefone" placeholder="Telefone" required>
    <button type="submit">Cadastrar</button>
</form>

<div class="box">
    <h3>Clientes</h3>
    <ul id="listaClientes"></ul>
</div>

<h2>Cadastro de Produtos</h2>
<form id="produtoForm">
    <input type="text" id="produtoNome" placeholder="Nome do Produto" required>
    <input type="date" id="validade" required>
    <input type="number" id="preco" placeholder="Preço" required>
    <input type="number" id="quantidade" placeholder="Quantidade" required>
    <input type="text" id="custo" placeholder="Tipo de custo">
    <input type="text" id="venda" placeholder="Venda">
    <button type="submit">Cadastrar Produto</button>
</form>

<div class="box">
    <h3>Estoque</h3>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Validade</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody id="tabelaEstoque"></tbody>
    </table>
</div>

<h2>Comanda Virtual</h2>
<form id="comandaForm">
    <input type="text" id="mesa" placeholder="Mesa ou Cliente" required>
    <input type="text" id="item" placeholder="Item consumido" required>
    <input type="number" id="valorItem" placeholder="Valor" required>
    <button type="submit">Adicionar</button>
</form>

<div class="box">
    <h3>Comandas</h3>
    <ul id="listaComandas"></ul>
</div>

<h2>Fluxo de Caixa</h2>
<div class="box">
    <p>Entradas: R$ <span id="entradas">0</span></p>
    <p>Saídas: R$ <span id="saidas">0</span></p>
    <p><strong>Saldo: R$ <span id="saldo">0</span></strong></p>
</div>

<script>
let clientes = [];
let produtos = [];
let comandas = [];
let entradas = 0;
let saidas = 0;


document.getElementById("clienteForm").onsubmit = e => {
    e.preventDefault();
    let cliente = {
        nome: nome.value,
        cpf: cpf.value,
        telefone: telefone.value
    };
    clientes.push(cliente);
    atualizarClientes();
    e.target.reset();
};

function atualizarClientes() {
    let lista = document.getElementById("listaClientes");
    lista.innerHTML = "";
    clientes.forEach(c => {
        lista.innerHTML += `<li>${c.nome} - ${c.cpf}</li>`;
    });
}


document.getElementById("produtoForm").onsubmit = e => {
    e.preventDefault();
    let produto = {
        nome: produtoNome.value,
        validade: validade.value,
        preco: parseFloat(preco.value),
        quantidade: parseInt(quantidade.value)
    };
    produtos.push(produto);
    atualizarEstoque();
    e.target.reset();
};

function atualizarEstoque() {
    let tabela = document.getElementById("tabelaEstoque");
    tabela.innerHTML = "";
    produtos.forEach(p => {
        tabela.innerHTML += `
        <tr>
            <td>${p.nome}</td>
            <td>${p.validade}</td>
            <td>${p.preco}</td>
            <td>${p.quantidade}</td>
        </tr>`;
    });
}


document.getElementById("comandaForm").onsubmit = e => {
    e.preventDefault();
    let comanda = {
        mesa: mesa.value,
        item: item.value,
        valor: parseFloat(valorItem.value)
    };
    comandas.push(comanda);
    entradas += comanda.valor;
    atualizarComandas();
    atualizarCaixa();
    e.target.reset();
};

function atualizarComandas() {
    let lista = document.getElementById("listaComandas");
    lista.innerHTML = "";
    comandas.forEach(c => {
        lista.innerHTML += `<li>Mesa: ${c.mesa} | Item: ${c.item} | R$ ${c.valor}</li>`;
    });
}


function atualizarCaixa() {
    document.getElementById("entradas").innerText = entradas.toFixed(2);
    document.getElementById("saidas").innerText = saidas.toFixed(2);
    document.getElementById("saldo").innerText = (entradas - saidas).toFixed(2);
}
</script>

</body>
</html>
