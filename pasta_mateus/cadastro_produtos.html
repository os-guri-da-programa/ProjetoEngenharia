<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produtos</title>
</head>
<body>

<h2>Cadastro de Produtos</h2>

<a href="clientes.html">Ir para Clientes</a>

<form id="formProduto">
  <input type="text" id="nomeProduto" placeholder="Nome do Produto" required>
  <input type="date" id="validade" required>
  <input type="number" id="preco" placeholder="Preço" required>
  <input type="number" id="quantidade" placeholder="Quantidade" required>
  <input type="text" id="tipoCusto" placeholder="Tipo de custo" required>
  <input type="number" id="venda" placeholder="Valor de venda" required>
  <button type="submit">Cadastrar</button>
</form>

<table border="1">
  <thead>
    <tr>
      <th>Produto</th>
      <th>Validade</th>
      <th>Preço</th>
      <th>Quantidade</th>
      <th>Tipo de Custo</th>
      <th>Venda</th>
    </tr>
  </thead>
  <tbody id="listaProdutos"></tbody>
</table>

<script>
let produtos = JSON.parse(localStorage.getItem("produtos")) || [];

function atualizarProdutos() {
  const lista = document.getElementById("listaProdutos");
  lista.innerHTML = "";

  produtos.forEach(p => {
    lista.innerHTML += `
      <tr>
        <td>${p.nome}</td>
        <td>${p.validade}</td>
        <td>R$ ${p.preco}</td>
        <td>${p.quantidade}</td>
        <td>${p.tipoCusto}</td>
        <td>R$ ${p.venda}</td>
      </tr>
    `;
  });
}

document.getElementById("formProduto").addEventListener("submit", function(e){
  e.preventDefault();

  const produto = {
    nome: document.getElementById("nomeProduto").value,
    validade: document.getElementById("validade").value,
    preco: document.getElementById("preco").value,
    quantidade: document.getElementById("quantidade").value,
    tipoCusto: document.getElementById("tipoCusto").value,
    venda: document.getElementById("venda").value
  };

  produtos.push(produto);
  localStorage.setItem("produtos", JSON.stringify(produtos));

  this.reset();
  atualizarProdutos();
});

atualizarProdutos();
</script>

</body>
</html>
