<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cronograma de Shows</title>

  <link rel="stylesheet" href="../pasta_fabiane/index.css">

  <style>
    .shows-grid {
      display: grid;
      gap: 20px;
    }

    .show-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
    }

    .show-card h3 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .show-info {
      margin-bottom: 6px;
    }

    .ingresso {
      color: #27ae60;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>

</head>

<body>

<div class="dashboard-container">

  <aside class="sidebar">

    <div class="logo">
        <img src="../images/logo_stage_six.png" width="150" height="100">
    </div>

    <nav class="menu">

      <section class="menu-group">

        <h3>Área do Cliente</h3>

        <ul>
          <li><a href="../pasta_enzo/cardapio.html">Cardápio</a></li>
          <li><a href="../pasta_davi/avaliacao.html">Avaliar Estabelecimento</a></li>
          <li><a href="../pasta_mateus/cronograma_shows.html">Cronogramas de Shows</a></li>
          <li><a href="../pasta_pedro/reservas.html">Reservas e Atendimento</a></li>
          <li><a href="../pasta_fabiane/index.html">Sair</a></li>
        </ul>

      </section>

    </nav>

  </aside>

  <main class="content">

    <header class="content-header">
      <h2>Cronograma de Shows</h2>
      <div class="user-info">Cliente</div>
    </header>

    <section class="view-container">

      <div id="listaShows" class="shows-grid"></div>

    </section>

  </main>

</div>

<script>

const shows = [
  {
    artista: "Stray Kids",
    data: "23/06/2026",
    hora: "22:00",
    local: "Palco Principal",
    ingresso: 25
  },

  {
    artista: "The Wibbas",
    data: "29/06/2026",
    hora: "21:00",
    local: "Palco Principal",
    ingresso: 30
  },

  {
    artista: "Estrellita: Estornei o Chão",
    data: "03/07/2026",
    hora: "15:20",
    local: "IFSC Câmpus Chapecó",
    ingresso: 22.5
  }

];

const lista =
  document.getElementById("listaShows");

shows.forEach(show => {

  lista.innerHTML += `

    <div class="show-card">

      <h3>${show.artista}</h3>

      <div class="show-info">
        📅 ${show.data}
      </div>

      <div class="show-info">
        🕒 ${show.hora}
      </div>

      <div class="show-info">
        📍 ${show.local}
      </div>

      <div class="ingresso">
        Ingresso: R$ ${show.ingresso.toFixed(2)}
      </div>

    </div>

  `;

});

</script>

</body>
</html>
