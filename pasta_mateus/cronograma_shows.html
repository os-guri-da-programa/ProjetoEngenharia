<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cronograma de Shows</title>

  <link rel="stylesheet" href="../pasta_fabiane/index.css">

  <style>
    .shows-grid {
      display: grid;
      gap: 20px;
    }

    .show-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
    }

    .show-card h3 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .show-info {
      margin-bottom: 6px;
    }

    .ingresso {
      color: #27ae60;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>

</head>

<body>

<div class="dashboard-container">

  <aside class="sidebar">

    <div class="logo">
      <h1>Cliente</h1>
    </div>

    <nav class="menu">

      <section class="menu-group">

        <h3>Área do Cliente</h3>

        <ul>
          <li><a href="../pasta_enzo/cardapio.html">Cardápio</a></li>
          <li><a href="../pasta_davi/avaliacao.html">Avaliar Estabelecimento</a></li>
          <li><a href="../pasta_mateus/cronograma_shows.html">Cronogramas de Shows</a></li>
          <li><a href="../pasta_pedro/reservas.html">Reservas e Atendimento</a></li>
          <li><a href="../pasta_fabiane/index.html">Sair</a></li>
        </ul>

      </section>

    </nav>

  </aside>

  <main class="content">

    <header class="content-header">
      <h2>Cronograma de Shows</h2>
      <div class="user-info">Cliente</div>
    </header>

    <section class="view-container">

      <div id="listaShows" class="shows-grid"></div>

    </section>

  </main>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

const lista =
  document.getElementById("listaShows");

function mostrar_shows(shows){
  shows.forEach(show => {

    lista.innerHTML += `

      <div class="show-card">

        <h3>${show.artista}</h3>

        <div class="show-info">
          📅 ${show.data}
        </div>

        <div class="show-info">
          🕒 ${show.hora}
        </div>

        <div class="show-info">
          📍 ${show.local}
        </div>

        <div class="ingresso">
          Ingresso: R$ ${show.preco_ingresso}
        </div>

      </div>

    `;

  });
}

$.ajax({
  url: '../pasta_pedro/api/select_shows.php',
  type: "GET",
  dataType: "json",
  success: function (shows) {
      console.log("Dados recebidos:", shows);
      mostrar_shows(shows);
  },
  error: function (error) {
      console.error("Erro ao obter dados:", error);
  }
})

</script>

</body>
</html>
